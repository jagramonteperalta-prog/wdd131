<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="author" content="John Agramonte">
    <meta name="description" content="A form for submitting product reviews.">

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review Form</h1>
    </header>

    <main>
        <h2>Product Review</h2>

        <form method="get" action="review.html">

        <label for="product-name">Product Name:</label>
        <select id="product-name" name="product-name" required>
            <option value="" selected disabled>Select a product</option>
        </select>

        <fieldset>
            <legend>Overall Rating</legend>


        <input type="radio" id="rating-1" name="rating" value="1" required>
        <label for="rating-1"> 1 - Poor</label>

        <input type="radio" id="rating-2" name="rating" value="2" required>
        <label for="rating-2"> 2 - Fair</label>

        <input type="radio" id="rating-3" name="rating" value="3" required>
        <label for="rating-3"> 3 - Average</label>

        <input type="radio" id="rating-4" name="rating" value="4" required>
        <label for="rating-4"> 4 - Good</label>

        <input type="radio" id="rating-5" name="rating" value="5" required>
        <label for="rating-5"> 5 - Excellent</label>

        </fieldset>

        <label for="install-date">Date of Installation</label>
        <input type="date" id="install-date" name="install-date" required>

        <fieldset>
            <legend>Useful Features (Check all that apply)</legend>

            <input type="checkbox" id="durability" name="features" value="durability">
            <label for="durability">Durability</label>

            <input type="checkbox" id="ease-of-use" name="features" value="ease-of-use">
            <label for="ease-of-use">Ease of Use</label>

            <input type="checkbox" id="performance" name="features" value="performance">
            <label for="performance">Performance</label>

            <input type="checkbox" id="design" name="features" value="design">
            <label for="design">Design</label>
        </fieldset>

        <label for="review-title">Review Title (Optional):</label>
        <input type="text" id="review-title" name="review-title">

        <label for="review-content">Written Review:(Optional)</label>
        <textarea id="review-content" name="review-content"></textarea>

        <label for="username">Your Name (Optional):</label>
        <input type="text" id="username" name="username">

        <button type="submit">Submit Review</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Product Review Form. All rights reserved.</p>
    </footer>
</body>
</html>
